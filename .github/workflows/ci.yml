name: TaskSeal CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verification:
    name: tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.12.0
          - 24.x
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install development dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  tests:
    name: tests
    if: ${{ always() }}
    needs:
      - verification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Node verification job
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: test "$VERIFICATION_RESULT" = "success"
